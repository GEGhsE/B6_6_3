        function jsonpGet(base, params, timeoutMs) {
            return new Promise(function (resolve) {
                if (!base) { resolve(null); return; }
                const cb = '__invcb' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
                const s = document.createElement('script');
                let done = false;
                function cleanup() {
                    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
                    if (s.parentNode) s.parentNode.removeChild(s);
                }
                window[cb] = function (data) { if (done) return; done = true; cleanup(); resolve(data); };
                const qs = Object.keys(params || {}).map(function (k) {

                s.onerror = function () { if (!done) { done = true; cleanup(); resolve(null); } };
                setTimeout(function () { if (!done) { done = true; cleanup(); resolve(null); } }, timeoutMs || 15000);

        // --- 앱 로직 ---

        async function startApp() {

        function hasAnyData(d) {

        function disableNavTemporarily() {
            if (state.currentStep === 0 || state.currentStep === steps.length - 1) return;

        function saveInput(key, val) { state.answers[key] = val; }
        function syncInput(key, id) { const el = document.getElementById(id); if (el && state.answers[key]) el.value = state.answers[key]; }
        function selectTechnique(t) { state.answers.technique = t; renderStep(); }


        let canvas, ctx;

        function initCanvas() {
            canvas = document.getElementById('drawing-canvas');
            if (!canvas) return;
            ctx = canvas.getContext('2d', { willReadFrequently: true });
            const rect = canvas.parentNode.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, rect.width, rect.height);

            if (state.canvasData) {
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
                img.src = state.canvasData;
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', drawMove);
            window.addEventListener('mouseup', endDraw);
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e.touches[0]); });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawMove(e.touches[0]); });
            canvas.addEventListener('touchend', endDraw);
        }

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        function startDraw(e) {
            const p = getPos(e);
            state.draw.isDrawing = true; state.draw.startX = p.x; state.draw.startY = p.y;
            state.draw.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (state.draw.tool === 'fill') {
                floodFill(Math.round(p.x), Math.round(p.y), state.draw.color);
                state.draw.isDrawing = false; state.canvasData = canvas.toDataURL();
            } else if (['pen', 'pencil', 'eraser'].includes(state.draw.tool)) {
                ctx.beginPath(); ctx.moveTo(p.x, p.y);
            }
        }

        function drawMove(e) {
            if (!state.draw.isDrawing) return;
            const p = getPos(e);
            ctx.lineWidth = state.draw.lineWidth;
            ctx.strokeStyle = state.draw.tool === 'eraser' ? '#FFFFFF' : state.draw.color;
            if (state.draw.tool === 'pen') {
                ctx.globalAlpha = 1.0; ctx.lineTo(p.x, p.y); ctx.stroke();
            } else if (state.draw.tool === 'pencil') {
                ctx.globalAlpha = 0.5;
                const density = state.draw.lineWidth * 0.8;
                for (let i = 0; i < density; i++) {
                    const r = Math.random() * state.draw.lineWidth;
                    const theta = Math.random() * 2 * Math.PI;
                    ctx.beginPath();
                    ctx.arc(p.x + r * Math.cos(theta), p.y + r * Math.sin(theta), 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = state.draw.color; ctx.fill();
                }
            } else if (state.draw.tool === 'eraser') {
                ctx.globalAlpha = 1.0; ctx.lineTo(p.x, p.y); ctx.stroke();
            } else if (['rect', 'circle', 'line'].includes(state.draw.tool)) {
                ctx.putImageData(state.draw.snapshot, 0, 0);
                ctx.globalAlpha = 1.0; ctx.beginPath();
                if (state.draw.tool === 'rect') {
                    ctx.strokeRect(state.draw.startX, state.draw.startY, p.x - state.draw.startX, p.y - state.draw.startY);
                } else if (state.draw.tool === 'circle') {
                    const rx = Math.abs(p.x - state.draw.startX) / 2, ry = Math.abs(p.y - state.draw.startY) / 2;
                    ctx.ellipse((p.x + state.draw.startX) / 2, (p.y + state.draw.startY) / 2, rx, ry, 0, 0, 2 * Math.PI);
                    ctx.stroke();
                } else if (state.draw.tool === 'line') {
                    ctx.moveTo(state.draw.startX, state.draw.startY); ctx.lineTo(p.x, p.y); ctx.stroke();
                }
            }
        }

        function endDraw() {
            if (state.draw.isDrawing) {
                state.draw.isDrawing = false; ctx.globalAlpha = 1.0; state.canvasData = canvas.toDataURL();
            }
        }

        function setTool(t) { state.draw.tool = t; renderStep(); }
        function setColor(c) { state.draw.color = c; renderStep(); }
        function setLineWidth(w) { state.draw.lineWidth = parseInt(w); }

        // 강력한 캔버스 초기화 (물리적 리셋)
        function forceResetCanvas() {
            if (!confirm("정말로 그림을 모두 지우고 새로 고칠까요?")) return;

            const cvs = document.getElementById('drawing-canvas');
            if (!cvs) return;
            const context = cvs.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = cvs.getBoundingClientRect();

            // 캔버스 크기를 다시 지정하여 메모리 수준에서 픽셀 데이터 완전 초기화
            cvs.width = rect.width * dpr;
            cvs.height = rect.height * dpr;

            // Context 설정 재적용
            context.scale(dpr, dpr);
            context.lineCap = 'round';
            context.lineJoin = 'round';

            // 현재 선택된 도구 속성 유지
            context.strokeStyle = state.draw.tool === 'eraser' ? '#FFFFFF' : state.draw.color;
            context.lineWidth = state.draw.lineWidth;

            // 흰색 배경 다시 칠하기
            context.fillStyle = '#FFFFFF';
            context.fillRect(0, 0, rect.width, rect.height);

            // 상태 초기화
            state.canvasData = null;
            state.draw.snapshot = null;

            openModal("완료", "도화지가 깨끗해졌습니다.");
        }

        function floodFill(startX, startY, fillHex) {
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const x = Math.round(startX * window.devicePixelRatio), y = Math.round(startY * window.devicePixelRatio);
            const target = getPix(img, x, y), fill = hexToRgb(fillHex);
            if (match(target, fill)) return;
            const stack = [[x, y]];
            while (stack.length) {
                const [cx, cy] = stack.pop();
                if (match(getPix(img, cx, cy), target)) {
                    setPix(img, cx, cy, fill);
                    if (cx > 0) stack.push([cx - 1, cy]); if (cx < img.width - 1) stack.push([cx + 1, cy]);
                    if (cy > 0) stack.push([cx, cy - 1]); if (cy < img.height - 1) stack.push([cx, cy + 1]);
                }
            }
            ctx.putImageData(img, 0, 0);
        }
        function getPix(img, x, y) { const i = (y * img.width + x) * 4; return [img.data[i], img.data[i + 1], img.data[i + 2]]; }
        function setPix(img, x, y, rgb) { const i = (y * img.width + x) * 4; img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255; }
        function match(c1, c2) { return Math.abs(c1[0] - c2[0]) < 30 && Math.abs(c1[1] - c2[1]) < 30 && Math.abs(c1[2] - c2[2]) < 30; }
        function hexToRgb(h) { const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h); return r ? [parseInt(r[1], 16), parseInt(r[2], 16), parseInt(r[3], 16)] : [0, 0, 0]; }


        async function downloadReportJPG() {
            const ec = document.getElementById('export-canvas'); const ectx = ec.getContext('2d');
            const w = 1240, h = 1754; ec.width = w; ec.height = h;

            ectx.fillStyle = '#FFFFFF'; ectx.fillRect(0, 0, w, h);

            ectx.fillStyle = '#0F172A'; ectx.fillRect(0, 0, w, 150);
            ectx.fillStyle = '#FFFFFF'; ectx.font = 'bold 60px Noto Sans KR'; ectx.textAlign = 'center'; ectx.fillText('INVENTION REPORT', w / 2, 100);

            ectx.textAlign = 'left';

            ectx.fillStyle = '#64748B'; ectx.font = 'bold 30px Noto Sans KR'; ectx.fillText('발명가', 100, 250);
            ectx.fillStyle = '#0F172A'; ectx.font = 'bold 40px Noto Sans KR'; ectx.fillText(state.nickname, 100, 300);

            ectx.textAlign = 'right';
            ectx.fillStyle = '#64748B'; ectx.font = 'bold 30px Noto Sans KR'; ectx.fillText('사용 기법', w - 100, 250);
            ectx.fillStyle = '#4F46E5'; ectx.font = 'bold 40px Noto Sans KR'; ectx.fillText(state.answers.technique, w - 100, 300);

            ectx.textAlign = 'center';
            ectx.fillStyle = '#0F172A'; ectx.font = 'black 80px Noto Sans KR'; ectx.fillText(state.answers.idea, w / 2, 450);

            ectx.textAlign = 'left';
            ectx.fillStyle = '#4F46E5'; ectx.font = 'bold 35px Noto Sans KR'; ectx.fillText('▼ 불편한 점', 100, 580);
            ectx.fillStyle = '#334155'; ectx.font = 'medium 30px Noto Sans KR'; wrapText(ectx, `"${state.answers.problem}"`, 100, 640, w - 200, 45);

            ectx.fillStyle = '#4F46E5'; ectx.font = 'bold 35px Noto Sans KR'; ectx.fillText('▼ 편리하게 개선하기', 100, 800);
            ectx.fillStyle = '#334155'; ectx.font = 'medium 30px Noto Sans KR'; wrapText(ectx, state.answers.description, 100, 860, w - 200, 45);

            ectx.fillStyle = '#1E293B'; ectx.font = 'bold 35px Noto Sans KR'; ectx.fillText('▼ 아이디어 설계 도면', 100, 1050);
            ectx.strokeRect(100, 1080, w - 200, 600);

            if (state.canvasData) {
                const img = new Image(); img.onload = () => {
                    const asp = img.width / img.height; let tw = w - 240, th = tw / asp; if (th > 560) { th = 560; tw = th * asp; }
                    ectx.drawImage(img, 100 + (w - 200 - tw) / 2, 1080 + (600 - th) / 2, tw, th);
                    const l = document.createElement('a'); l.download = `Invention_${state.nickname}.jpg`; l.href = ec.toDataURL('image/jpeg', 0.95); l.click();
                }; img.src = state.canvasData;
            } else {
                const l = document.createElement('a'); l.download = `Invention_${state.nickname}.jpg`; l.href = ec.toDataURL('image/jpeg', 0.95); l.click();
            }
        }

        function wrapText(ctx, t, x, y, mw, lh) {
            const ch = t.split(''); let l = '';
            for (let n = 0; n < ch.length; n++) {
                let test = l + ch[n];
                if (ctx.measureText(test).width > mw && n > 0) { ctx.fillText(l, x, y); l = ch[n]; y += lh; } else l = test;
            } ctx.fillText(l, x, y);
        }

        // === 스프레드시트(Apps Script) 연동 ===

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function isUrlConfigured() {
            return CONFIG.APPS_SCRIPT_URL && !CONFIG.APPS_SCRIPT_URL.startsWith('PASTE_');
        }

        const STUDENT_CACHE_KEY = 'invention_student_list_v1';
        const STUDENT_CACHE_TTL = 1000 * 60 * 60 * 24; // 24시간

        function showLoading(visible) {
            const loading = document.getElementById('loading-area');
            const form = document.getElementById('form-area');
            if (loading) loading.classList.toggle('hidden', !visible);
            if (form) form.classList.toggle('hidden', visible);
            if (form && !visible) form.classList.add('flex');
        }

        function setLoadingMessage(html, isError) {
            const loading = document.getElementById('loading-area');
            if (!loading) return;
            const color = isError ? 'text-red-600' : 'text-slate-500';
            loading.innerHTML = `<p class="text-sm font-bold ${color} text-center">${html}</p>`;
        }

        // 학생이 드롭다운에서 이름을 선택하면 즉시 백그라운드로 답변을 미리 가져옴
        const submissionPromises = {};
        function prefetchSubmission(name) {
            if (!name || submissionPromises[name]) return;
            submissionPromises[name] = fetchSubmission(name);
        }

        function populateSelect(students) {
            const select = document.getElementById('select-nickname');
            const startBtn = document.getElementById('btn-start');
            if (!select) return;
            const prev = select.value;
            select.innerHTML = '<option value="">— 이름을 선택하세요 —</option>' +
                students.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
            if (prev && students.includes(prev)) select.value = prev;
            if (startBtn) startBtn.disabled = !select.value;
            select.onchange = () => {
                if (startBtn) startBtn.disabled = !select.value;
                if (select.value) prefetchSubmission(select.value);
            };
        }

        async function loadStudents() {
            if (!isUrlConfigured()) {
                // 체험 모드: 시트 없이 학생1~30 으로 바로 시작할 수 있게 한다.
                populateSelect(demoStudents());
                showLoading(false);
                return;
            }

            // 1. 캐시가 있으면 즉시 표시
            let usingCache = false;
            try {
                const raw = localStorage.getItem(STUDENT_CACHE_KEY);
                const cached = raw ? JSON.parse(raw) : null;
                if (cached && Array.isArray(cached.students) && cached.students.length > 0
                    && Date.now() - cached.t < STUDENT_CACHE_TTL) {
                    populateSelect(cached.students);
                    showLoading(false);
                    usingCache = true;
                }
            } catch (e) { /* ignore cache errors */ }

            // 2. 백그라운드에서 최신 명단 가져오기
            try {
                const json = await jsonpGet(CONFIG.APPS_SCRIPT_URL, { action: 'students' }, 15000) || { ok: false, error: '연결 실패' };
                if (!json.ok) throw new Error(json.error || 'unknown');
                const students = json.students || [];
                try {
                    localStorage.setItem(STUDENT_CACHE_KEY, JSON.stringify({ t: Date.now(), students }));
                } catch (e) { /* ignore */ }

                if (students.length === 0) {
                    if (!usingCache) setLoadingMessage("명단이 비어있어요.<br>'학생명단' 시트에 이름을 추가해 주세요.");
                    return;
                }
                populateSelect(students);
                showLoading(false);
            } catch (err) {
                if (!usingCache) {
                    setLoadingMessage('명단을 불러올 수 없어요.<br>네트워크/URL을 확인해주세요.', true);
                }
            }
        }

        async function fetchSubmission(name) {
            if (!isUrlConfigured()) return null;
            try {
                // lite=1 → 그림 필드 제외해서 빠르게 로드
                const json = await jsonpGet(CONFIG.APPS_SCRIPT_URL, { action: 'load', name: name, lite: 1 }, 15000) || { ok: false, error: '연결 실패' };
                if (json.ok) return json.data;
            } catch (err) {
                console.warn('Load failed:', err);
            }
            return null;
        }

        function applySubmission(d) {
            state.answers.problem = d.문제 || '';
            state.answers.technique = d.기법 || '';
            state.answers.idea = d.발명품이름 || '';
            state.answers.description = d.설명 || '';
            state.answers.obs = [d.관찰1 || '', d.관찰2 || '', d.관찰3 || ''];
            state.answers.review = {
                '더하기': d.더하기 || '',
                '빼기': d.빼기 || '',
                '모양 바꾸기': d.모양바꾸기 || '',
                '재료 바꾸기': d.재료바꾸기 || '',
                '용도 바꾸기': d.용도바꾸기 || '',
                '크기 바꾸기': d.크기바꾸기 || '',
                '반대로 하기': d.반대로하기 || ''
            };
            state.canvasData = d.그림 || null;
        }

        // PNG dataURL을 JPEG로 변환 (시트 셀 5만 자 한도 대응)
        async function dataURLToJPEG(dataURL, quality = 0.7) {
            if (!dataURL) return '';
            if (dataURL.startsWith('data:image/jpeg')) return dataURL;
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = img.width; c.height = img.height;
                    const cx = c.getContext('2d');
                    cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, c.width, c.height);
                    cx.drawImage(img, 0, 0);
                    resolve(c.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(dataURL);
                img.src = dataURL;
            });
        }

        // 자동 저장: 입력 변경 후 1.5초 동안 추가 입력 없으면 저장
        let autoSaveTimer = null;
        function scheduleAutoSave() {
            if (!state.nickname) return;
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => saveToSheet(true), 1500);
        }

        function setSaveStatus(text, color) {
            const el = document.getElementById('save-status');
            if (!el) return;
            el.innerText = text;
            el.style.color = color || '#64748B';
        }

        async function saveToSheet(silent = false) {
            if (!state.nickname) {
                if (!silent) openModal("알림", "저장할 내용이 없습니다.");
                return;
            }
            if (!isUrlConfigured()) {
                if (!silent) openModal("설정 필요", "Apps Script URL이 설정되지 않았어요.");
                return;
            }

            // (1단계는 캔버스 단계 없음)

            if (silent) {
                setSaveStatus('저장 중...', '#64748B');
            } else {
                document.getElementById('modal-title').innerText = "저장 중";
                document.getElementById('modal-body').innerText = "스프레드시트에 저장하고 있어요...";
                document.getElementById('modal-loader').classList.remove('hidden');
                document.getElementById('modal-overlay').classList.remove('hidden');
            }

            try {
                const drawing = state.canvasData ? await dataURLToJPEG(state.canvasData, 0.7) : '';
                const payload = {
                    이름: state.nickname,
                    문제: state.answers.problem || '',
                    기법: state.answers.technique || '',
                    발명품이름: state.answers.idea || '',
                    설명: state.answers.description || '',
                    관찰1: state.answers.obs[0] || '',
                    관찰2: state.answers.obs[1] || '',
                    관찰3: state.answers.obs[2] || '',
                    더하기: state.answers.review['더하기'] || '',
                    빼기: state.answers.review['빼기'] || '',
                    모양바꾸기: state.answers.review['모양 바꾸기'] || '',
                    재료바꾸기: state.answers.review['재료 바꾸기'] || '',
                    용도바꾸기: state.answers.review['용도 바꾸기'] || '',
                    크기바꾸기: state.answers.review['크기 바꾸기'] || '',
                    반대로하기: state.answers.review['반대로 하기'] || '',
                    그림: drawing
                };
                let json;
                if (!isUrlConfigured()) {
                    // 체험 모드: 시트 대신 이 기기에 저장한다.
                    json = demoSave(state.nickname, payload)
                        ? { ok: true }
                        : { ok: false, error: '이 기기에 저장하지 못했어요' };
                } else {
                    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    json = await res.json();
                }
                if (silent) {
                    if (json.ok) {
                        const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
                        setSaveStatus(`✓ ${time} 자동 저장됨`, '#16A34A');
                    } else {
                        setSaveStatus('⚠ 저장 실패', '#DC2626');
                        console.warn('Auto-save failed:', json.error);
                    }
                    return;
                }
                document.getElementById('modal-loader').classList.add('hidden');
                if (json.ok) {
                    document.getElementById('modal-title').innerText = "저장 완료";
                    document.getElementById('modal-body').innerText = json.warning || "스프레드시트에 저장되었어요!";
                } else {
                    document.getElementById('modal-title').innerText = "저장 실패";
                    document.getElementById('modal-body').innerText = json.error || "알 수 없는 오류가 발생했어요.";
                }
            } catch (err) {
                if (silent) {
                    setSaveStatus('⚠ 저장 실패 (네트워크)', '#DC2626');
                    console.warn('Auto-save error:', err);
                    return;
                }
                document.getElementById('modal-loader').classList.add('hidden');
                document.getElementById('modal-title').innerText = "오류";
                document.getElementById('modal-body').innerText = "저장에 실패했어요. 네트워크를 확인해 주세요.";
            }
        }

        function openModal(t, b) {
            const title = document.getElementById('modal-title'), body = document.getElementById('modal-body'), overlay = document.getElementById('modal-overlay');
            title.innerText = t; body.innerText = b; overlay.classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }

        function showCompletionModal() {
            document.getElementById('modal-title').innerText = "🎉 학습 완료!";
            document.getElementById('modal-body').innerText = "1단계 발명 기법 탐구를 모두 마쳤어요.\n정말 잘했어요!\n2단계 나만의 발명 설계도\n도전해 보세요.";
            document.getElementById('modal-loader').classList.add('hidden');
            document.getElementById('modal-overlay').classList.remove('hidden');
        }



        document.addEventListener('click', (e) => {
            if (e.target.id === 'btn-next') {
                // 1단계: 1=관찰, 2~8=7개 기법, 9=정리
                if (state.currentStep === 1 && !state.answers.obs.every(a => a.trim())) { openModal("알림", "모든 칸을 채워주세요!"); return; }
                if (state.currentStep < steps.length - 1) {
                    state.currentStep++;
                    renderStep();
                } else {
                    showCompletionModal();
                }
            }
        });

        window.onload = () => renderStep();
    </script>

<script>
(function () {

        if (b) b.style.display = 'flex';
      }
    } catch (e) {}

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showDemoBanner);
